name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test and package on Linux
        if: runner.os == 'Linux'
        run: ./gradlew test fatJar
      - name: Test and package on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat test fatJar
      - name: Integration test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\integration-test.ps1
